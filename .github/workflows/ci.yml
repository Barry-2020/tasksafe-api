name: CI

on:
  push:
    branches: [main, security-demo]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Pruebas y auditoría
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

      - name: Revisar vulnerabilidades conocidas
        run: npm audit --audit-level=high
